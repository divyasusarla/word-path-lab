<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Path checks</title>
<link rel="stylesheet" href="../vendor/fredoka/fredoka.css">
<style>
  body { margin: 0; background: #FFF7EA; color: #2A2350; font-family: 'Fredoka', system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 32px; margin: 0 0 4px; }
  .lede { margin: 0 0 16px; color: #5C5677; }
  #summary { font-size: 20px; font-weight: 700; padding: 12px 16px; border-radius: 16px; background: #fff; margin-bottom: 12px; }
  #summary.pass { background: #D5F5EC; } #summary.fail { background: #FFE9E7; }
  button { font-family: inherit; height: 40px; padding: 0 18px; border: 0; border-radius: 999px; background: #7B61FF; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  ol { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 6px; }
  li { background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 15px; }
  li .detail { font-size: 13px; color: #5C5677; margin-top: 2px; white-space: pre-wrap; }
  li.fail { background: #FFE9E7; } li.pass .mark { color: #17977F; } li.fail .mark { color: #B0322A; }
  .mark { font-weight: 700; margin-right: 6px; }
  .frame { position: sticky; top: 16px; align-self: start; }
  iframe { width: 100%; aspect-ratio: 4 / 3; border: 0; border-radius: 16px; background: #fff; box-shadow: 0 6px 0 #E8DCC8; }
  .frame p { font-size: 13px; color: #5C5677; }
</style>
</head>
<body>
<main>
  <section>
    <h1>Word Path checks</h1>
    <p class="lede">Plays every level and opens every screen in test mode, with the voice muted. Nothing is saved.</p>
    <div id="summary">Not run yet</div>
    <button id="run">Run all checks</button>
    <ol id="results"></ol>
  </section>
  <section class="frame">
    <iframe id="game" title="Game under test"></iframe>
    <p>The game runs here while the checks play it. These checks can't hear the voice, so use the listening checklist in TESTING.md for that.</p>
  </section>
</main>
<script type="module">
import { SOUNDS } from '../sounds.js';
import { tests as unitTests } from './unit/engine.test.js';
import { LEVELS, STAGES, STICKERS, coverage, allPictureFiles, decodableBy, phonemes, soundSimilarity } from '../content.js';
import { PICTURE_WORDS, OPTION_WORDS, codecOffset, KEEP_LEAD } from '../engine.js?v=dev';
import { SCRIPT, SCRIPT_IDS } from '../script.js?v=dev';
const levelOf = type => LEVELS.find(l => l.type === type).n;
const usedClips = new Map();   // clip id -> where the game got it ('recording' or 'voice')
const frame = document.getElementById('game');
const list = document.getElementById('results');
const summary = document.getElementById('summary');
const runBtn = document.getElementById('run');
let passed = 0, failed = 0;

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(fn, ms = 4000, what = 'condition') {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { const v = fn(); if (v) return v; } catch (e) {} await sleep(25); }
  throw new Error(`Timed out waiting for ${what}`);
}
// Opens the game in the frame. Waits for the old page to be gone first: on slower engines (WebKit) the previous
// game can still answer for a moment, and a check would read the wrong level.
async function blank() {
  frame.src = 'about:blank';
  await waitFor(() => { try { return !frame.contentWindow.wp; } catch (e) { return true; } }, 4000, 'the previous page to close');
}
async function open(path) {
  await blank();
  frame.src = path;
  return waitFor(() => frame.contentWindow.wp && frame.contentWindow, 6000, 'the game to load');
}
async function load(query) {
  const w = await open(`../?test&mute&think=0${query ? '&' + query : ''}`);
  await sleep(50);
  return w;
}
const doc = () => frame.contentDocument;
const text = () => doc().body.innerText;
function missingIcons() {
  const bad = new Set();
  doc().querySelectorAll('i[class*="icon-"]').forEach(el => {
    const c = frame.contentWindow.getComputedStyle(el, '::before').content;
    if (!c || c === 'none' || c === 'normal' || c === '""') bad.add([...el.classList].find(k => k.startsWith('icon-')));
  });
  return [...bad];
}
function brokenPictures() {
  return [...new Set([...doc().querySelectorAll('img')].filter(im => im.complete && !im.naturalWidth).map(im => im.getAttribute('src')))];
}
function report(name, ok, detail = '') {
  ok ? passed++ : failed++;
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.innerHTML = `<span class="mark">${ok ? '✓' : '✗'}</span>`;
  li.append(name);
  if (detail) { const d = document.createElement('div'); d.className = 'detail'; d.textContent = detail; li.append(d); }
  list.append(li);
}
async function check(name, fn) {
  try { const detail = await fn(); report(name, true, detail || ''); }
  catch (e) { report(name, false, e.message); }
}
function expect(cond, msg) { if (!cond) throw new Error(msg); }

async function playLevel(n) {
  const w = await load(`level=${n}&rounds=3`);
  const wp = w.wp;
  await waitFor(() => wp.state().screen === 'play', 2000, 'the level to start');
  const s0 = wp.state();
  await waitFor(() => wp.spoken().some(t => t.startsWith(`Level ${n}.`)), 2000, `"Level ${n}." to be spoken`);
  const icons = new Set(), targets = [];
  for (let r = 0; r < s0.rounds; r++) {
    const s = wp.state();
    expect(s.round === r, `expected round ${r + 1}, got ${s.round + 1}`);
    expect(s.target, `round ${r + 1} has no target`);
    targets.push(s.target);
    missingIcons().forEach(i => icons.add(i));
    brokenPictures().forEach(i => icons.add(i));
    if (r === 0) {
      wp.clearSpoken();
      expect(wp.wrong(), 'could not pick a wrong answer');
      await waitFor(() => wp.spoken().some(t => /Try again|Tap it|Tap that one/.test(t)), 3000, 'wrong-answer feedback');
      expect(!wp.state().solved, 'a wrong answer was marked as solved');
    }
    expect(wp.right(), 'could not pick the right answer');
    if (r < s0.rounds - 1) await waitFor(() => wp.state().round === r + 1, 4000, `round ${r + 2}`);
  }
  await waitFor(() => wp.state().screen === 'done', 4000, 'the level complete screen');
  await waitFor(() => wp.spoken().some(t => /You earned the/.test(t)), 2000, 'the sticker message');
  missingIcons().forEach(i => icons.add(i));
  expect(wp.state().done[n - 1], 'level not marked done');
  const rec = new Set(wp.recorded());
  for (const x of wp.spokenDetail()) if (x.clip) {
    expect((x.src === 'recording') === rec.has(x.clip), `sound "${x.clip}" used the ${x.src} but ${rec.has(x.clip) ? 'has' : 'has no'} recording`);
    usedClips.set(x.clip, x.src);
  }
  expect(!icons.size, `missing icons or pictures: ${[...icons].join(', ')}`);
  return `stage ${s0.stage} · ${s0.type} · targets: ${targets.join(', ')}`;
}

async function runAll() {
  runBtn.disabled = true; list.innerHTML = ''; passed = failed = 0; usedClips.clear();
  summary.className = ''; summary.textContent = 'Running…';

  for (const [name, fn] of unitTests) await check(`Unit: ${name}`, async () => { await fn(); });
  await check('Content: every letter and sound is taught, every word has a picture, words only use sounds already taught', async () => {
    const problems = coverage();
    expect(!problems.length, problems.join('\n'));
    return `${LEVELS.length} levels in ${STAGES.length} stages`;
  });
  await check('Pictures: every picture file exists', async () => {
    const files = allPictureFiles(), missing = [];
    await Promise.all(files.map(async f => { const r = await fetch(`../vendor/noto/${f}`, { method: 'HEAD' }); if (!r.ok) missing.push(f); }));
    expect(!missing.length, `missing: ${missing.join(', ')}`);
    return `${files.length} pictures`;
  });
  await check('Map: stage 1 shows its levels, only level 1 open, Next up shows level 1', async () => {
    await load('');
    const nodes = doc().querySelectorAll('button[aria-label^="Level "]');
    expect(nodes.length === STAGES[0].count, `found ${nodes.length} level buttons, expected ${STAGES[0].count}`);
    expect(/Next up/.test(text()) && /Level 1: Letter sounds/.test(text()), 'Next up banner wrong');
    expect(/Stage 1/.test(text()), 'stage title missing');
    const m = missingIcons().concat(brokenPictures()); expect(!m.length, `missing: ${m.join(', ')}`);
  });
  await check('Map: the arrows step through every stage, each with its own levels', async () => {
    const w = await load('');
    const seen = [];
    for (let k = 0; k < STAGES.length; k++) {
      await waitFor(() => w.wp.state().mapStage === k, 1000, `stage ${k + 1}`);
      const n = doc().querySelectorAll('button[aria-label^="Level "]').length;
      expect(n === STAGES[k].count, `stage ${k + 1} shows ${n} levels, expected ${STAGES[k].count}`);
      seen.push(n);
      if (k < STAGES.length - 1) doc().querySelector('button[aria-label="Next stage"]').click();
    }
    const m = missingIcons().concat(brokenPictures()); expect(!m.length, `missing: ${m.join(', ')}`);
    return `levels per stage: ${seen.join(', ')}`;
  });
  await check('Map: after finishing stage 1, it opens on stage 2 with its first level next', async () => {
    const w = await load(`done=${STAGES[0].count}`);
    expect(w.wp.state().mapStage === 1, 'map did not move to stage 2');
    expect(text().includes(`Level ${STAGES[1].first + 1}: Letter sounds`), 'Next up did not move to stage 2');
  });
  await check('Map: with every level finished, finished message and no Play button', async () => {
    await load(`done=${LEVELS.length}`);
    expect(/You finished every level!/.test(text()), 'finished message missing');
    expect(![...doc().querySelectorAll('button')].some(b => b.innerText.trim() === 'Play'), 'Play button still showing');
  });
  await check('Map: "Hear it" speaks the next level', async () => {
    const w = await load('done=2');
    doc().querySelector('button[aria-label="Hear it"]').click();
    await waitFor(() => w.wp.spoken().some(t => t.includes(LEVELS[2].title)), 2000, 'the level name to be spoken');
  });
  await check('Sticker book: none earned shows every sticker locked', async () => {
    await load('screen=stickers');
    expect(/My stickers/.test(text()) && text().includes(`0/${LEVELS.length}`), 'header or count wrong');
    expect(doc().querySelectorAll('i.icon-lock').length === LEVELS.length, `expected ${LEVELS.length} locked stickers`);
  });
  await check('Sticker book: all earned shows every sticker with its name and picture', async () => {
    await load(`screen=stickers&done=${LEVELS.length}`);
    expect(text().includes(`${LEVELS.length}/${LEVELS.length}`), 'count wrong');
    for (const st of STICKERS) expect(text().includes(st.name), `missing sticker ${st.name}`);
    await sleep(300);
    const m = missingIcons().concat(brokenPictures()); expect(!m.length, `missing: ${m.join(', ')}`);
  });
  await check('Settings: opens with voice, volume, speed, test and reset', async () => {
    const w = await load('screen=settings');
    expect(/Grown-up settings/.test(text()), 'settings did not open');
    expect(doc().querySelector('select'), 'voice list missing');
    expect(doc().querySelectorAll('input[type=range]').length === 2, 'expected volume and speed sliders');
    const testBtn = [...doc().querySelectorAll('button')].find(b => /Test voice/.test(b.innerText));
    testBtn.click();
    await waitFor(() => w.wp.spoken().some(t => /play with letters/.test(t)), 2000, 'the test voice line');
  });
  await check('Grown-up gate: Settings needs a sum; a wrong answer gives a new sum; once right, it stays open', async () => {
    const w = await load('');
    const settingsBtn = () => doc().querySelector('[aria-label="Grown-up settings"]');
    const press = keys => { for (const k of keys) doc().querySelector(`.gate-pad [aria-label="${k}"]`).click(); };
    settingsBtn().click();
    await waitFor(() => w.wp.gate(), 1000, 'the gate');
    expect(!w.wp.state().settings && /Grown-ups only/.test(text()), 'settings opened without the gate');
    const first = w.wp.gate().answer, wrong = String(first + 1);
    press([...wrong, 'Enter']);
    await waitFor(() => w.wp.gate()?.wrong, 1000, 'the wrong-answer note');
    expect(!w.wp.state().settings && /Not quite/.test(text()), 'a wrong answer should not open settings');
    press([...String(w.wp.gate().answer).slice(0, 1), 'Delete', ...String(w.wp.gate().answer), 'Enter']);
    await waitFor(() => w.wp.state().settings, 1000, 'settings to open');
    expect(!w.wp.gate(), 'the gate should close');
    doc().querySelector('.settings-card [aria-label="Close"]').click();
    await waitFor(() => !w.wp.state().settings, 1000, 'settings to close');
    settingsBtn().click();
    await waitFor(() => w.wp.state().settings, 1000, 'settings to open again without the gate');
    return `first sum's answer ${first}`;
  });
  await check('Progress report: opens from Settings and shows the totals, needs-practice items and played levels', async () => {
    const w = await load('screen=settings&demo');
    [...doc().querySelectorAll('button')].find(b => /Progress report/.test(b.innerText)).click();
    await waitFor(() => w.wp.state().screen === 'report' && doc().querySelector('.report-card'), 1000, 'the report');
    const r = w.wp.report(), t = text();
    expect(t.includes(`${r.finished}/${r.levelCount}`) && t.includes(`${Math.round(100 * r.right / r.tries)}%`), 'totals missing');
    expect(doc().querySelectorAll('.report-chip:not(.more)').length === r.practice.length && r.practice.length > 0, 'needs-practice chips wrong');
    expect(doc().querySelectorAll('.report-row').length === r.levels.length, 'level rows wrong');
    expect(!/undefined|NaN|Invalid/.test(t), 'something didn\'t resolve');
    [...doc().querySelectorAll('button')].find(b => /Settings/.test(b.innerText) && b.closest('.report-card')).click();
    await waitFor(() => w.wp.state().settings, 1000, 'back to settings');
    const empty = await load('screen=report');
    expect(/Nothing played yet/.test(text()), 'empty report message missing');
    return `${r.levels.length} levels, ${r.practice.length} needs-practice items (+${r.morePractice})`;
  });
  await check('About and credits: opens from settings and credits the research and every asset licence', async () => {
    const w = await load('screen=settings');
    [...doc().querySelectorAll('button')].find(b => /About and credits/.test(b.innerText)).click();
    await waitFor(() => w.wp.state().screen === 'about', 1000, 'the about screen');
    for (const t of ['About Word Path', 'National Reading Panel', 'Foorman', 'Ehri', 'Letters and Sounds', 'Noto Emoji', 'Apache', 'Fredoka', 'SIL Open Font', 'Lucide', 'Preact', 'isn\'t affiliated'])
      expect(text().includes(t), `missing "${t}"`);
    expect(!/&[a-z]+;/.test(text()), 'an HTML entity shows as text (htm doesn\'t decode entities: type the character itself)');
  });
  await check('Settings: speed slider changes the label, and nothing is saved', async () => {
    const w = await load('screen=settings');
    const before = JSON.stringify(Object.keys(w.localStorage).filter(k => k.startsWith('wordpath')).map(k => [k, w.localStorage.getItem(k)]));
    const r = doc().querySelectorAll('input[type=range]')[1];
    r.value = '0.6'; r.dispatchEvent(new w.Event('input', { bubbles: true }));
    await waitFor(() => /Talking speed: slow/.test(text()), 1000, 'the speed label to say slow');
    const after = JSON.stringify(Object.keys(w.localStorage).filter(k => k.startsWith('wordpath')).map(k => [k, w.localStorage.getItem(k)]));
    expect(before === after, 'test mode wrote to saved progress or settings');
  });
  for (let n = 1; n <= LEVELS.length; n++) await check(`Level ${n}: plays through with a wrong and right answer, then gives its sticker`, () => playLevel(n));
  await check('Rhyme time: each picture has its word underneath', async () => {
    await load(`level=${levelOf('rhyme')}`);
    const pics = [...doc().querySelectorAll('button[aria-label="Picture choice"]')];
    expect(pics.length === 3, `found ${pics.length} pictures`);
    const words = pics.map(b => b.innerText.trim());
    expect(words.every(w => /^[a-z]+$/.test(w)), `words under pictures: ${JSON.stringify(words)}`);
    return words.join(', ');
  });
  await check('Blend it and Read it: no words under pictures (it would give the answer away)', async () => {
    for (const n of [levelOf('blend'), levelOf('read')]) {
      await load(`level=${n}`);
      const words = [...doc().querySelectorAll('button[aria-label="Picture choice"]')].map(b => b.innerText.trim()).filter(Boolean);
      expect(!words.length, `level ${n} shows words: ${words.join(', ')}`);
    }
  });
  await check('Sort levels: the question doesn\'t end with a spoken "?"', async () => {
    for (const n of LEVELS.filter(l => l.type === 'sort').map(l => l.n)) {
      const w = await load(`level=${n}`);
      await waitFor(() => w.wp.spoken().length > 3, 2000, 'the question');
      const bad = w.wp.spoken().filter(t => /^\W+$/.test(t.trim()));
      expect(!bad.length, `level ${n} speaks punctuation on its own: ${JSON.stringify(bad)}`);
    }
  });
  await check('Wrong options: similar-sounding words score higher (cat → cap above dog)', async () => {
    expect(soundSimilarity('cat', 'cap') > soundSimilarity('cat', 'dog'), 'cap should be closer to cat than dog is');
    expect(soundSimilarity('cat', 'can') > soundSimilarity('cat', 'pin'), 'can should be closer to cat than pin is');
    expect(soundSimilarity('ship', 'shell') > soundSimilarity('ship', 'ring'), 'shell should be closer to ship than ring is');
  });
  await check('Blend it and Read it: wrong options share the first or last sound with the answer whenever possible', async () => {
    const shares = (a, b) => { const A = phonemes(a), B = phonemes(b); return A[0] === B[0] || A[A.length - 1] === B[B.length - 1]; };
    const notes = [];
    for (const L of LEVELS.filter(l => l.type === 'blend' || l.type === 'read')) {
      const w = await load(`level=${L.n}&rounds=8`);
      const pool = OPTION_WORDS;
      for (let r = 0; r < 8; r++) {
        const s = w.wp.state();
        const wrongs = s.options.filter(o => o !== s.target);
        expect(wrongs.length === 2, `level ${L.n}: expected 2 wrong options, got ${wrongs.length}`);
        for (const o of wrongs) expect(pool.includes(o), `level ${L.n}: "${o}" has no picture, or one likely to be misnamed`);
        const possible = pool.some(x => x !== s.target && shares(s.target, x));
        if (possible) expect(wrongs.some(o => shares(s.target, o)), `level ${L.n}: "${s.target}" got ${wrongs.join(', ')}, which share no first or last sound`);
        if (r === 0) notes.push(`${L.n}: ${s.target} → ${wrongs.join(', ')}`);
        w.wp.right();
        if (r < 7) await waitFor(() => w.wp.state().round === r + 1, 4000, `round ${r + 2} of level ${L.n}`);
      }
    }
    return notes.join(' · ');
  });
  await check('Read it: "Sound it out" says the sounds, not the word', async () => {
    const n = LEVELS.find(l => l.type === 'read').n;
    const w = await load(`level=${n}`);
    await waitFor(() => w.wp.spoken().length > 0, 2000, 'the first prompt');
    const target = w.wp.state().target;
    w.wp.clearSpoken();
    [...doc().querySelectorAll('button')].find(b => /Sound it out/.test(b.innerText)).click();
    await waitFor(() => w.wp.spokenDetail().length >= phonemes(target).length, 2000, 'the sounds');
    await sleep(100);
    const said = w.wp.spokenDetail();
    expect(said.every(x => x.clip), `said something other than sounds: ${said.filter(x => !x.clip).map(x => x.t).join(', ')}`);
    expect(said.length === phonemes(target).length, `expected ${phonemes(target).length} sounds for "${target}", got ${said.length}`);
    return `${target}: ${said.map(x => x.clip).join(' · ')}`;
  });
  const SIZES = [['wide', 1180, 820], ['tablet-portrait', 820, 1180], ['phone', 390, 844], ['phone-landscape', 844, 390]];
  for (const [name, wd, ht] of SIZES) await check(`Layout ${name} (${wd}×${ht}): map and every kind of level fit the screen, with big enough buttons`, async () => {
    frame.style.width = `${wd}px`; frame.style.height = `${ht}px`; frame.style.aspectRatio = 'auto';
    try {
      const issues = [];
      for (const q of ['done=8', 'level=1', 'level=3', 'level=9', 'level=10', 'level=11', 'level=30', 'screen=done&level=9', 'screen=stickers&done=14', 'screen=settings', 'screen=gate', 'screen=report', 'screen=report&demo', 'screen=about']) {
        const scrolls = /stickers|settings|about|report/.test(q);   // long pages may scroll down, never sideways
        const w = await load(q);
        // measure where things end up, not mid-animation (bubbles fly in from below; hidden tabs pause animations)
        const still = doc().createElement('style'); still.textContent = '*, *::before, *::after { animation: none !important; transition: none !important; }';
        doc().head.append(still);
        await sleep(150);
        if (w.wp.layout() !== name) issues.push(`${q}: layout ${w.wp.layout()}`);
        const de = doc().documentElement;
        if (de.scrollWidth > wd + 1) issues.push(`${q}: scrolls sideways (${de.scrollWidth}px wide)`);
        if (!scrolls && de.scrollHeight > ht + 2) issues.push(`${q}: scrolls down (${de.scrollHeight}px tall)`);
        const wide = [...doc().querySelectorAll('main *, .settings-card *')].find(el => el.getBoundingClientRect().right > wd + 1);
        if (wide) issues.push(`${q}: something sticks out on the right (${wide.tagName.toLowerCase()} "${(wide.innerText || '').trim().slice(0, 20)}")`);
        const box = doc().querySelector('.map-box');
        if (box) {
          const b = box.getBoundingClientRect();
          doc().querySelectorAll('.map-stop').forEach(el => { const r = el.getBoundingClientRect(); if (r.left < b.left - 1 || r.right > b.right + 1 || r.top < b.top - 1 || r.bottom > b.bottom + 1) issues.push(`${q}: "${el.innerText.replace(/\s+/g, ' ').trim()}" sticks out of the map`); });
        }
        const hear = doc().querySelector('.hear');
        if (hear) { const r = hear.getBoundingClientRect(); if (r.bottom > ht || r.right > wd || r.left < 0) issues.push(`${q}: Hear again is off screen`); }
        const small = [...doc().querySelectorAll('main button, .settings-card button')].filter(el => { const r = el.getBoundingClientRect(); return r.width && (r.width < 40 || r.height < 40); });
        if (small.length) issues.push(`${q}: ${small.length} buttons smaller than 40px`);
        const answers = [...doc().querySelectorAll('.play-main button')].filter(el => el.getBoundingClientRect().width);
        const overlaps = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
        for (const c of doc().querySelectorAll('.play-bottom button')) for (const ans of answers)
          if (overlaps(c.getBoundingClientRect(), ans.getBoundingClientRect())) { issues.push(`${q}: "${c.innerText.trim() || c.getAttribute('aria-label')}" covers an answer`); break; }
        const tiny = answers.filter(el => { const r = el.getBoundingClientRect(); return r.width < 64 || r.height < 64; });
        if (tiny.length) issues.push(`${q}: ${tiny.length} answers smaller than 64px`);
      }
      expect(!issues.length, issues.join('\n'));
    } finally { frame.style.width = ''; frame.style.height = ''; frame.style.aspectRatio = ''; }
  });
  await check('Mastery: only the first tap of each round is recorded', async () => {
    const n = LEVELS.find(l => l.type === 'blend').n;
    const w = await load(`level=${n}&rounds=3`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    const keys = [];
    for (let r = 0; r < 3; r++) {
      keys.push(`blend:${w.wp.state().target}`);
      if (r === 0) { w.wp.wrong(); await sleep(50); w.wp.wrong(); await sleep(50); }
      w.wp.right();
      if (r < 2) await waitFor(() => w.wp.state().round === r + 1, 4000, `round ${r + 2}`);
    }
    await waitFor(() => w.wp.state().screen === 'done', 4000, 'level complete');
    const m = w.wp.mastery();
    const all = Object.values(m).flat();
    expect(all.length === 3, `expected 3 recorded attempts, got ${all.length}: ${JSON.stringify(m)}`);
    expect(m[keys[0]][0].ok === false, 'a wrong first tap should record as not right');
    expect(m[keys[1]].at(-1).ok === true && m[keys[2]].at(-1).ok === true, 'right first taps should record as right');
    return `${keys.join(', ')} → ${all.map(a => a.ok ? '✓' : '✗').join(' ')}`;
  });
  await check('Feedback: after two misses the answer is shown and said, then tapping it counts as not first-try', async () => {
    const n = LEVELS.find(l => l.type === 'sight').n;
    const w = await load(`level=${n}&rounds=2`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    w.wp.clearSpoken();
    w.wp.wrong(); await sleep(60);
    expect(!w.wp.state().modelled, 'shown after only one miss');
    w.wp.wrong();
    await waitFor(() => w.wp.state().modelled, 1000, 'the answer to be shown');
    await waitFor(() => w.wp.spoken().some(t => /Here it is/.test(t)), 2000, '"Here it is"');
    const glowing = [...doc().querySelectorAll('.play-main button')].filter(b => getComputedStyle(b).boxShadow.includes('255, 194, 60'));
    expect(glowing.length === 1 && glowing[0].innerText.trim() === w.wp.state().target, 'the answer should be the one highlighted');
    w.wp.right();
    await waitFor(() => w.wp.spoken().some(t => /That's it/.test(t)), 2000, '"That\'s it"');
    expect(w.wp.state().firstTries[0] === false, 'the round should count as not first-try');
  });
  await check('Feedback: a sort level shows the right bin after one miss', async () => {
    const n = LEVELS.find(l => l.type === 'sort').n;
    const w = await load(`level=${n}`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    w.wp.wrong();
    await waitFor(() => w.wp.state().modelled, 1000, 'the answer to be shown');
    expect(doc().querySelectorAll('.bin.shown').length === 1, 'one bin should be highlighted');
  });
  await check('Feedback: praise says what was right', async () => {
    const n = LEVELS.find(l => l.type === 'sounds').n;
    const w = await load(`level=${n}&rounds=1`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    w.wp.clearSpoken(); w.wp.right();
    const after = () => { const d = w.wp.spokenDetail(), i = d.findIndex(x => /Yes! That says/.test(x.t)); return i >= 0 && d[i + 1]; };
    const next = await waitFor(after, 2000, 'the praise and the sound after it');
    expect(next.clip, 'the sound should follow the praise');
  });
  await check('Bonus rounds: level 1 plays each letter once, then brings back the one missed, labelled "Bonus round"', async () => {
    const L = LEVELS.find(l => l.type === 'sounds');
    const w = await load(`level=${L.n}&rounds=8`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    const seen = [];
    let missed = null;
    for (let r = 0; r < 8; r++) {
      const s = w.wp.state();
      if (r < L.pool.length) expect(!s.bonus, `round ${r + 1} shouldn't be a bonus round yet`);
      else {
        expect(s.bonus, `round ${r + 1} should be a bonus round`);
        expect(doc().querySelector('.progress-count.bonus')?.innerText.includes('Bonus round'), 'the "Bonus round" label should show');
        expect(s.target !== seen.at(-1), `"${s.target}" came up twice in a row`);
        if (r === L.pool.length) {
          expect(s.target === missed, `the first bonus round should be the missed letter "${missed}", got "${s.target}"`);
          expect(w.wp.spoken().includes('Bonus round!'), '"Bonus round!" should be said');
        }
      }
      seen.push(s.target);
      if (r === 1) { missed = s.target; w.wp.wrong(); await sleep(50); }
      w.wp.right();
      if (r < 7) await waitFor(() => w.wp.state().round === r + 1, 4000, `round ${r + 2}`);
    }
    expect(new Set(seen.slice(0, L.pool.length)).size === L.pool.length, `each letter once first: ${seen.join(' ')}`);
    return seen.join(' ');
  });
  await check('Level complete: offers "Practise again" when under half the first taps were right', async () => {
    const n = LEVELS.find(l => l.type === 'blend').n;
    const w = await load(`level=${n}&rounds=3`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    for (let r = 0; r < 3; r++) {
      w.wp.wrong(); await sleep(40); w.wp.right();
      if (r < 2) await waitFor(() => w.wp.state().round === r + 1, 4000, `round ${r + 2}`);
    }
    await waitFor(() => w.wp.state().screen === 'done', 4000, 'level complete');
    const btns = [...doc().querySelectorAll('button')].map(b => b.innerText.trim());
    expect(btns.includes('Practise again'), `no Practise again button: ${btns.join(', ')}`);
    expect(btns.includes('Next level'), 'Next level should still be offered');
    await waitFor(() => w.wp.spoken().some(t => /practise this one again/.test(t)), 2000, 'the spoken suggestion');
  });
  await check('Session: after the chosen time, level complete suggests a break', async () => {
    const n = LEVELS.find(l => l.type === 'blend').n;
    const w = await load(`level=${n}&rounds=1&session=0.001`);
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    await sleep(120); w.wp.right();
    await waitFor(() => w.wp.state().screen === 'done', 4000, 'level complete');
    expect(/Time for a break/.test(text()), 'no break message on screen');
    await waitFor(() => w.wp.spoken().some(t => /Time for a break/.test(t)), 2000, 'the spoken suggestion');
    const w2 = await load('screen=settings');
    expect(/Suggest a break after/.test(text()), 'no session setting in Settings');
  });
  await check('Sound: a recording is only played when sound is running; otherwise the voice says it (never silence)', async () => {
    const w = await open('../?test&think=0&level=1');   // not muted: the real audio path
    await waitFor(() => w.wp.spokenDetail().some(x => x.clip), 8000, 'the first speech sound');
    const clips = w.wp.spokenDetail().filter(x => x.clip), played = w.wp.played();
    expect(played.every(p => p.state === 'running'), `a recording played while sound was ${played.map(p => p.state).join(', ')}`);
    expect(clips.every(x => ['recording', 'fallback', 'voice'].includes(x.src)), 'unknown source');
    expect(clips.filter(x => x.src === 'recording').length <= played.length, 'claimed a recording that never played');
    frame.src = 'about:blank';
    return `first sound: ${clips[0].src} (sound ${w.wp.audioState()})`;
  });
  await check('Sound: recordings load per level (letter sounds and instructions first), never all at once', async () => {
    const w = await open('../?test&think=0&level=1');
    await waitFor(() => w.wp.recorded().length, 4000, 'the recording list');
    w.wp.preloadNow();
    await waitFor(() => w.wp.loadedClips().length > 0, 4000, 'recordings to start loading');
    await sleep(200);
    const loaded = new Set(w.wp.loadedClips()), recorded = w.wp.recorded();
    if (!recorded.some(id => id.startsWith('word-'))) { frame.src = 'about:blank'; return 'no word recordings imported yet'; }
    expect(!loaded.has('word-family'), 'loaded a word from the last stage while playing level 1');
    expect(loaded.has('word-apple') && loaded.has('say-try-again'), 'level 1 words and instructions should be loaded');
    expect(loaded.size < recorded.length / 2, `loaded ${loaded.size} of ${recorded.length} recordings`);
    frame.src = 'about:blank';
    return `${loaded.size} of ${recorded.length} recordings loaded for level 1`;
  });
  await check('Sound: recordings play from the small .m4a copies (or the .wav if this browser can\'t decode them)', async () => {
    const m = await (await fetch('../audio/manifest.json', { cache: 'no-cache' })).json();
    if (!m.clips.length) return 'no recordings';
    expect(m.m4a && m.m4a.length === m.clips.length, `${m.m4a?.length ?? 0} of ${m.clips.length} clips have a compressed copy: run tools/import_audio.py --encode-all`);
    const ctx = new OfflineAudioContext(1, 1, 22050), decode = async url => ctx.decodeAudioData(await (await fetch(url)).arrayBuffer());
    const sample = ['m', 'word-ship', 'say-level-9-blend-it', 'say-try-again'].filter(id => m.clips.includes(id));
    let aac = true;
    for (const id of sample) {
      const wav = await decode(`../audio/${id}.wav`);
      let small; try { small = await decode(`../audio/${id}.m4a`); } catch (e) { aac = false; continue; }
      // after skipping any codec padding (as the game does), the sound starts and lasts as in the original
      const lead = b => { const x = b.getChannelData(0); let i = 0; while (i < x.length && Math.abs(x[i]) < 0.01) i++; return i / b.sampleRate; };
      const skip = codecOffset(small.getChannelData(0), small.sampleRate);
      expect(Math.abs((lead(small) - skip) - Math.min(lead(wav), KEEP_LEAD)) < 0.03, `${id}: starts ${(lead(small) - skip).toFixed(3)}s in, original ${lead(wav).toFixed(3)}s`);
      expect(Math.abs((small.duration - skip) - (wav.duration - Math.max(0, lead(wav) - KEEP_LEAD))) < 0.12, `${id}: ${(small.duration - skip).toFixed(3)}s compressed vs ${wav.duration.toFixed(3)}s`);
    }
    const w = await open('../?test&think=0&level=1');
    await waitFor(() => w.wp.recorded().length, 4000, 'the recording list');
    w.wp.preloadNow();
    await waitFor(() => Object.keys(w.wp.clipSources()).length > 20, 6000, 'recordings to decode');
    const srcs = Object.values(w.wp.clipSources());
    expect(srcs.every(x => x === (aac ? 'm4a' : 'wav')), `expected every clip from ${aac ? '.m4a' : '.wav (no AAC here)'}, got ${[...new Set(srcs)].join(', ')}`);
    frame.src = 'about:blank';
    return `${srcs.length} clips decoded from .${srcs[0]}${aac ? '' : ' (this browser can\'t decode AAC, so the .wav fallback was used)'}`;
  });
  await check('Sound: when iOS won\'t start sound, letter sounds fall back to the voice instead of silence', async () => {
    const w = await open('../?test&think=0&level=1');
    await waitFor(() => w.wp.spokenDetail().some(x => x.clip), 8000, 'the first speech sound');
    expect(w.wp.blockAudio() === 'blocked', 'could not simulate stopped sound');
    w.wp.clearSpoken(); const before = w.wp.played().length;
    w.wp.replay();
    const soundIds = new Set(SOUNDS.map(x => x.id)), isSound = x => x.clip && soundIds.has(x.clip);
    await waitFor(() => w.wp.spokenDetail().some(isSound), 8000, 'the sound after blocking');
    const clip = w.wp.spokenDetail().find(isSound);
    expect(clip.src === 'fallback', `expected the voice fallback, got ${clip.src}`);
    expect(w.wp.played().length === before, 'played a recording into stopped sound');
    frame.src = 'about:blank';
  });
  await check('Screen and voice say the same thing: level complete and the sorting question', async () => {
    const w = await load('level=1&rounds=1');
    await waitFor(() => w.wp.state().screen === 'play', 2000, 'the level');
    w.wp.right();
    await waitFor(() => w.wp.state().screen === 'done' && w.wp.spoken().some(t => /You earned/.test(t)), 4000, 'level complete');
    const said = w.wp.spoken(), screen = text();
    for (const line of ['You did it!', `You earned the ${LEVELS[0].sticker.name} sticker!`]) {
      expect(said.includes(line), `not said: "${line}"`); expect(screen.includes(line), `not on screen: "${line}"`);
    }
    for (const L of ['start', 'has'].map(ask => LEVELS.find(l => l.type === 'sort' && (l.ask || 'start') === ask)).filter(Boolean)) {
      const s = await load(`level=${L.n}`);
      await waitFor(() => s.wp.spoken().some(t => /^Does it/.test(t)), 3000, 'the sorting question');
      const q = s.wp.spoken().find(t => /^Does it/.test(t));
      expect(text().includes(`${q}…`), `level ${L.n}: says "${q}", screen doesn't`);
    }
  });
  await check('Show the word after the answer: the word appears with the right letters lit, on every screen size', async () => {
    const notes = [];
    const cases = [[LEVELS.find(l => l.type === 'sort').n, (s, rv) => rv.on.length === 1 && rv.text.startsWith(rv.on[0])],
      [LEVELS.find(l => l.type === 'sounds').n, (s, rv) => rv.on.length === 1],
      [LEVELS.find(l => l.type === 'blend').n, (s, rv) => rv.text === s.target && rv.on.join('') === s.target],
      [LEVELS.find(l => l.type === 'rhyme').n, (s, rv) => rv.on.length === 2],
      [LEVELS.find(l => l.type === 'sight').n, (s, rv) => rv && rv.text.replace(/\s*♥$/, '') === s.target]];
    try {
      for (const [name, wd, ht] of SIZES) {
        frame.style.width = `${wd}px`; frame.style.height = `${ht}px`; frame.style.aspectRatio = 'auto';
        for (const [n, good] of cases) {
          const w = await open(`../?test&mute&think=3&level=${n}`);   // a pause after the answer, so the word stays up
          await waitFor(() => w.wp.state().screen === 'play' && w.wp.state().level === n, 3000, `level ${n}`);
          const s = w.wp.state(); w.wp.right();
          const rv = await waitFor(() => { const x = w.wp.reveal(); return x && (n !== cases[2][0] || x.on.join('') === s.target) && x; }, 3000, `the word in level ${n}`);
          expect(good(s, rv), `${name}, level ${n} (${s.target}): ${JSON.stringify(rv)}`);
          const el = doc().querySelector('.reveal');
          if (el) {
            await sleep(400);   // let the card finish sliding in before measuring
            const b = el.getBoundingClientRect();
            expect(b.left >= 0 && b.right <= wd + 1 && b.top >= 0 && b.bottom <= ht + 1, `${name}, level ${n}: the word card is off screen (${Math.round(b.left)}–${Math.round(b.right)} × ${Math.round(b.top)}–${Math.round(b.bottom)} on ${wd}×${ht})`);
          }
          if (name === 'wide' && rv) notes.push(`${n}: ${rv.text} [${rv.on.join(' ')}]`);
        }
      }
    } finally { frame.style.width = ''; frame.style.height = ''; frame.style.aspectRatio = ''; }
    return notes.join(' · ');
  });
  await check('Level complete: Next level button goes to the next level', async () => {
    const w = await load('screen=done&level=3');
    expect(/You did it!/.test(text()) && text().includes(`You earned the ${LEVELS[2].sticker.name} sticker!`), 'level complete text wrong');
    [...doc().querySelectorAll('button')].find(b => /Next level/.test(b.innerText)).click();
    await waitFor(() => w.wp.state().screen === 'play' && w.wp.state().level === 4, 2000, 'level 4 to start');
  });

  await check('Recordings: every sound, word and line the levels use has a slot in the recording list', async () => {
    const ids = new Set([...SOUNDS.map(x => x.id), ...SCRIPT_IDS]);
    expect(ids.size === SOUNDS.length + SCRIPT.length, 'the recording list has duplicate ids');
    expect(SOUNDS.length === 69, `expected 69 sounds (43 + 26 letter names), found ${SOUNDS.length}`);
    const unknown = [...usedClips.keys()].filter(id => !ids.has(id));
    expect(!unknown.length, `the game uses sounds, words or lines with no recording slot: ${unknown.join(', ')}`);
    const rec = [...usedClips].filter(([, src]) => src === 'recording').length;
    return `${usedClips.size} different sounds, words and lines used across all levels (3 rounds each); ${rec} played from recordings, ${usedClips.size - rec} from the browser voice`;
  });
  await check('Play-through checklist page: loads every section with level numbers from the content', async () => {
    frame.src = '../tools/checklist.html';
    const w = await waitFor(() => frame.contentWindow.checklistReady && frame.contentWindow, 6000, 'the checklist to load');
    expect(w.checklistReady.sections >= 13, `only ${w.checklistReady.sections} sections`);
    expect(doc().querySelectorAll('.item').length === w.checklistReady.items, 'not every item rendered');
    expect(!/undefined|NaN/.test(text()), 'a level number didn\'t resolve');
    return `${w.checklistReady.sections} sections, ${w.checklistReady.items} items`;
  });
  await check('Heart words page: shows every sight word in its Word pop level', async () => {
    frame.src = '../tools/hearts.html';
    const w = await waitFor(() => frame.contentWindow.heartsReady && frame.contentWindow, 6000, 'the heart words page');
    expect(w.heartsReady.words === 300 && w.heartsReady.levels === LEVELS.filter(l => l.type === 'sight').length, `${w.heartsReady.words} words in ${w.heartsReady.levels} levels`);
    expect(doc().querySelectorAll('.w b').length > 0, 'no tricky letters shown');
    return `${w.heartsReady.words} words, ${w.heartsReady.hearts} heart words`;
  });
  await check('Picture review page: shows every picture', async () => {
    frame.src = '../tools/pictures.html';
    const w = await waitFor(() => frame.contentWindow.picturesReady && frame.contentWindow, 6000, 'the picture page to load');
    const cards = doc().querySelectorAll('.card').length;
    expect(cards === w.picturesReady.pictures, `${cards} cards for ${w.picturesReady.pictures} pictures`);
    await sleep(500);
    const broken = brokenPictures(); expect(!broken.length, `broken pictures: ${broken.join(', ')}`);
    return `${w.picturesReady.pictures} pictures, ${w.picturesReady.high} flagged likely misnamed, ${w.picturesReady.mild} worth a look`;
  });
  await check('Recorder page: loads with the 69 sounds and every word and line, in batches, and every icon', async () => {
    frame.src = '../tools/record.html';
    const w = await waitFor(() => frame.contentWindow.recorderReady && frame.contentWindow, 6000, 'the recorder to load');
    expect(w.recorderReady.sounds === 69, `recorder lists ${w.recorderReady.sounds} sounds`);
    expect(w.recorderReady.clips === 69 + SCRIPT.length, `recorder lists ${w.recorderReady.clips} clips, expected ${69 + SCRIPT.length}`);
    expect(w.recorderReady.batches === STAGES.length + 1, `${w.recorderReady.batches} batches`);
    expect(doc().querySelectorAll('nav button').length === 69, 'the first batch should show the 69 sounds');
    expect(doc().querySelectorAll('#batches button').length === STAGES.length + 1, 'a button per batch');
    const m = missingIcons(); expect(!m.length, `missing icons: ${m.join(', ')}`);
    return `${w.recorderReady.clips} clips in ${w.recorderReady.batches} batches; ${w.recorderReady.recorded} recorded in this browser`;
  });

  await check('Recorder processing: trims key clicks, keeps pauses inside a word, evens volume, warns on bad takes, zips', async () => {
    frame.src = '../tools/record.html?selftest';
    const w = await waitFor(() => frame.contentWindow.recorderTest && frame.contentWindow, 6000, 'the recorder test hooks');
    const T = w.recorderTest; T.init();
    const R = 22050, tone = (sec, amp = 0.3, f = 220) => Array.from({ length: Math.round(sec * R) }, (_, i) => amp * Math.sin(2 * Math.PI * f * i / R));
    const sil = sec => new Array(Math.round(sec * R)).fill(0), click = () => tone(0.015, 0.7, 3000);
    const take = parts => T.encodeWav(Float32Array.from(parts.flat()), R);
    // start click (inside the skipped first 0.25 s), a word with a 0.2 s gap, a stop click in the last 0.12 s
    const word = await T.processBlob(take([sil(0.05), click(), sil(0.4), tone(0.5), sil(0.2), tone(0.4), sil(0.3), click(), sil(0.03)]), 'word');
    expect(!word.empty && Math.abs(word.dur - 1.24) < 0.12, `word kept ${word.dur?.toFixed(2)}s, expected about 1.24s (both halves, no clicks)`);
    expect(!word.warn, `unexpected warning: ${word.warn}`);
    const quiet = await T.processBlob(take([sil(0.3), tone(0.6, 0.03), sil(0.3)]), 'word');
    const loud = await T.processBlob(take([sil(0.3), tone(0.6, 0.5), sil(0.3)]), 'word');
    const level = async wav => { const x = new Int16Array((await wav.arrayBuffer()).slice(44)); let e = 0; for (const v of x) e += (v / 32768) ** 2; return Math.sqrt(e / x.length); };
    const [lq, ll] = [await level(quiet.wav), await level(loud.wav)];
    expect(Math.abs(lq - ll) < 0.03, `volumes not evened out: ${lq.toFixed(3)} vs ${ll.toFixed(3)}`);
    expect((await T.processBlob(take([sil(0.3), tone(0.6, 0.999), sil(0.3)]), 'word')).warn.includes('too loud'), 'no warning for a clipped take');
    expect((await T.processBlob(take([sil(0.3), tone(2), sil(0.3)]), 'word')).warn.includes('quicker'), 'no warning for a long word');
    expect((await T.processBlob(take([sil(0.3), tone(0.4), sil(0.3)]), 'hold')).warn.includes('longer'), 'no warning for a short held sound');
    expect((await T.processBlob(take([sil(1)]), 'word')).empty, 'silence should count as empty');
    const zip = new Uint8Array(await (await T.makeZip([{ name: 'word-cat.wav', blob: word.wav }, { name: 'say-yes.wav', blob: loud.wav }])).arrayBuffer());
    const head = String.fromCharCode(...zip.slice(0, 4)), names = new TextDecoder().decode(zip);
    expect(head === 'PK\x03\x04' && names.includes('word-cat.wav') && names.includes('say-yes.wav'), 'zip is not a valid archive of both clips');
    return `word ${word.dur.toFixed(2)}s; levels ${lq.toFixed(3)} / ${ll.toFixed(3)}`;
  });

  summary.className = failed ? 'fail' : 'pass';
  summary.textContent = failed ? `${failed} failed, ${passed} passed` : `All ${passed} checks passed`;
  runBtn.disabled = false;
  window.testResult = { passed, failed };
}

runBtn.onclick = runAll;
if (new URLSearchParams(location.search).has('run')) runAll();
</script>
